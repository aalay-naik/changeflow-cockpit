# Runs linting and tests on every pull request and on every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege: the pipeline can only read the code
permissions:
  contents: read

# A new push to the same pull request cancels the older, now outdated run.
# Runs on main are never cancelled, so every commit on main gets a full result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Install dependencies (exactly as in uv.lock)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest

  frontend:
    name: Frontend (lint + types + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies (exactly as in package-lock.json)
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build

  infra:
    name: Docker Compose file is valid
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate compose file (with the fake example values)
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml config --quiet
